#==============================================================================
# JENKINS CONTROLLER VALIDATION
#==============================================================================

#==============================================================================
# WORKFLOW IDENTITY
#==============================================================================

name: 01 - Validate Jenkins controller

#==============================================================================
# WORKFLOW TRIGGERS
#==============================================================================

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

#==============================================================================
# WORKFLOW PERMISSIONS
#==============================================================================

permissions:
  contents: read

#==============================================================================
# WORKFLOW CONCURRENCY
#==============================================================================

concurrency:
  group: jenkins-controller-validation-${{ github.ref }}
  cancel-in-progress: true

#==============================================================================
# CONTROLLER VALIDATION JOB
#==============================================================================

jobs:
  validate:
    name: 01 - Validate Jenkins Controller
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 01 - Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: 02 - Validate Bash
        run: shellcheck scripts/*.sh

      - name: 03 - Validate controller configuration
        run: bash scripts/validate.sh

      - name: 04 - Verify latest version pins
        run: bash scripts/check-latest-versions.sh

      - name: 05 - Validate dry run
        run: bash scripts/manage.sh dry-run

      - name: 06 - Validate bootstrap payload size
        run: test "$(wc -c < scripts/bootstrap.sh)" -le 4096

      - name: 07 - Build controller image
        run: docker compose build