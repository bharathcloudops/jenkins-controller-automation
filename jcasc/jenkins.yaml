#==============================================================================
# JENKINS CONFIGURATION AS CODE
#==============================================================================

#==============================================================================
# CONTROLLER CORE CONFIGURATION
#==============================================================================

jenkins:
  systemMessage: Controller configuration is managed as code.
  numExecutors: 0
  mode: NORMAL
  scmCheckoutRetryCount: 2

  #============================================================================
  # NATIVE SECURITY REALM
  #============================================================================

  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: ${JENKINS_ADMIN_ID}
          password: ${JENKINS_ADMIN_PASSWORD}

  #============================================================================
  # AUTHORIZATION STRATEGY
  #============================================================================

  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false

  #============================================================================
  # CONTROLLER ENVIRONMENT
  #============================================================================

  globalNodeProperties:
    - envVars:
        env:
          - key: LANG
            value: C.UTF-8
          - key: LC_ALL
            value: C.UTF-8

  #============================================================================
  # PLATFORM BUILD AGENT
  #============================================================================

  nodes:
    - permanent:
        name: platform-agent
        nodeDescription: Resource-limited Docker build agent on the platform host
        remoteFS: /home/jenkins/agent
        numExecutors: 1
        mode: NORMAL
        labelString: platform docker
        retentionStrategy: always
        launcher:
          inbound:
            workDirSettings:
              disabled: false
              internalDir: remoting
              failIfWorkDirIsMissing: false

#==============================================================================
# CONTROLLER SECURITY HEADERS
#==============================================================================

security:
  contentSecurityPolicy:
    enforce: true

#==============================================================================
# MANAGED CREDENTIALS
#==============================================================================

credentials:
  system:
    domainCredentials:
      - credentials:
          - string:
              scope: GLOBAL
              id: github-token
              secret: ${GITHUB_TOKEN}
              description: GitHub automation token
          - usernamePassword:
              scope: GLOBAL
              id: github-scm
              username: bharathadigopula
              password: ${GITHUB_TOKEN}
              description: GitHub source control credential
          - usernamePassword:
              scope: GLOBAL
              id: github-registry
              username: bharathadigopula
              password: ${GITHUB_REGISTRY_TOKEN}
              description: GitHub container registry credential

#==============================================================================
# CONTROLLER LOCATION
#==============================================================================

unclassified:
  globalLibraries:
    libraries:
      - name: jenkins-pipeline-templates
        defaultVersion: v1.5.0
        allowVersionOverride: true
        implicit: false
        includeInChangesets: true
        retriever:
          modernSCM:
            scm:
              gitSource:
                remote: https://github.com/bharathcloudops/jenkins-pipeline-templates.git
  location:
    url: ${JENKINS_URL}
  resourceRoot:
    url: ${JENKINS_RESOURCE_ROOT_URL}

#==============================================================================
# MANAGED REPOSITORY JOBS
#==============================================================================

jobs:
  - script: |
      def validationRepositories = [
        [name: 'backstage-platform', description: 'Shared Backstage developer platform'],
        [name: 'clinirova', displayName: 'Clinirova', description: 'Clinirova application validation, image releases, and production deployment'],
        [name: 'bharath-oci-host-config', description: 'Private OCI host configuration'],
        [name: 'github-pipeline-templates', description: 'Reusable GitHub workflow templates'],
        [name: 'ignitox-wordpress', description: 'Private BharathCoudOps WordPress image'],
        [name: 'jenkins-controller-automation', description: 'Jenkins controller automation'],
        [name: 'jenkins-pipeline-templates', description: 'Jenkins shared pipeline library'],
        [name: 'monitoring-stack-automation', description: 'Monitoring stack automation'],
        [name: 'shared-host-automation', description: 'Shared host automation'],
        [name: 'terraform-oci-modules', description: 'Shared OCI Terraform modules'],
        [name: 'tf-bharath-oci-infra', description: 'OCI production Terraform infrastructure'],
        [name: 'wordpress-kubernetes-automation', description: 'Reusable WordPress Kubernetes automation']
      ]
      validationRepositories.each { repositoryConfig ->
        folder(repositoryConfig.name) {
          displayName(repositoryConfig.displayName ?: repositoryConfig.name)
          description(repositoryConfig.description)
        }
        multibranchPipelineJob(repositoryConfig.name + '/validate') {
          if (repositoryConfig.name == 'clinirova') {
            displayName('01 - Validate Changes')
          }
          description('Automatic main and pull request validation for ' + repositoryConfig.name)
          branchSources {
            github {
              id(repositoryConfig.name + '-validation')
              scanCredentialsId('github-scm')
              checkoutCredentialsId('github-scm')
              repoOwner('bharathadigopula')
              repository(repositoryConfig.name)
              includes('main PR-*')
              excludes('')
              buildOriginBranch(true)
              buildOriginBranchWithPR(false)
              buildOriginPRHead(true)
              buildOriginPRMerge(false)
              buildForkPRHead(false)
              buildForkPRMerge(false)
            }
          }
          factory {
            workflowBranchProjectFactory {
              scriptPath('.jenkins/pipelines/validate.groovy')
            }
          }
          orphanedItemStrategy {
            discardOldItems {
              numToKeep(20)
            }
          }
          triggers {
            periodicFolderTrigger {
              interval('5m')
            }
          }
        }
      }
  - script: |
      def clinirovaJobs = [
        [name: 'publish-runtime', displayName: '02 - Publish Application Image', description: 'Build, security-scan, and publish the Clinirova application image. Publication requires approval.'],
        [name: 'publish-migration', displayName: '03 - Publish Database Update Image', description: 'Build, security-scan, and publish the database schema update image for the same application release. This job does not change the production database or move the application between hosts. Publication requires approval.'],
        [name: 'deploy', displayName: '04 - Upgrade Production', description: 'Upgrade Clinirova on its existing K3s cluster using approved application and database update image digests. Includes backup, database schema updates, readiness, and email checks. The move to K3s is complete. Production changes require approval.']
      ]
      clinirovaJobs.each { lifecycle ->
        pipelineJob('clinirova/' + lifecycle.name) {
          displayName(lifecycle.displayName)
          description(lifecycle.description)
          definition {
            cpsScm {
              scm {
                git {
                  remote {
                    url('https://github.com/bharathcloudops/clinirova.git')
                    credentials('github-scm')
                  }
                  branch('*/main')
                }
              }
              scriptPath('.jenkins/pipelines/' + lifecycle.name + '.groovy')
              lightweight(true)
            }
          }
        }
      }
